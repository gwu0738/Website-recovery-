# Vanta: HTTPS in front of the backend, which serves the site itself on :8787.
# certbot adds the HTTPS server block and the redirect.
server {
    listen 80;
    server_name casino.example.com;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;   # deposit verification can wait for finality
    }
}
