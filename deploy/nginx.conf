# Vanta: static site + API on one origin. certbot adds the HTTPS server block.
server {
    listen 80;
    server_name casino.example.com;

    root /opt/vanta/app/web;
    index index.html;

    # The backend (systemd service on :8787)
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;   # deposit verification can wait for finality
    }

    # The site
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    location ~* \.(css|js|svg|png)$ {
        expires 1h;
    }

    # Never serve anything but the web folder
    location ~ /\. { deny all; }
}
